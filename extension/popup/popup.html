<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    width: 280px;
    padding: 18px 20px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
    color: #1a1a1a;
  }
  h1 {
    font-size: 16px;
    margin: 0 0 12px;
    letter-spacing: -0.3px;
  }
  .status-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    padding: 8px 12px;
    background: #f5f5f5;
    border-radius: 6px;
    font-size: 13px;
  }
  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
    margin-right: 6px;
  }
  .status-dot.on { background: #22c55e; }
  .status-dot.off { background: #ef4444; }

  .btn {
    display: block;
    width: 100%;
    padding: 10px 0;
    margin-bottom: 10px;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.2s;
    text-align: center;
  }
  .btn-primary {
    background: #2563eb;
    color: #fff;
  }
  .btn-primary:hover { background: #1d4ed8; }
  .btn-primary:disabled { background: #93c5fd; cursor: default; }

  .btn-secondary {
    background: #f3f4f6;
    color: #374151;
    border: 1px solid #d1d5db;
  }
  .btn-secondary:hover { background: #e5e7eb; }

  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    padding: 8px 12px;
    background: #f5f5f5;
    border-radius: 6px;
  }
  .toggle-label {
    font-size: 13px;
    font-weight: 500;
  }
  .toggle-switch {
    position: relative;
    width: 44px;
    height: 24px;
    flex-shrink: 0;
  }
  .toggle-switch input {
    opacity: 0;
    width: 0;
    height: 0;
  }
  .toggle-slider {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: #d1d5db;
    border-radius: 24px;
    cursor: pointer;
    transition: 0.2s;
  }
  .toggle-slider::before {
    content: "";
    position: absolute;
    height: 18px;
    width: 18px;
    left: 3px;
    bottom: 3px;
    background: #fff;
    border-radius: 50%;
    transition: 0.2s;
  }
  input:checked + .toggle-slider { background: #2563eb; }
  input:checked + .toggle-slider::before { transform: translateX(20px); }

  .hint {
    font-size: 11px;
    color: #999;
    text-align: center;
    margin-top: 4px;
  }
  .hint a { color: #2563eb; }
</style>
</head>
<body>
<h1>AI 对话记录器</h1>

<div class="status-row" id="serverStatus">
  <span><span class="status-dot off" id="statusDot"></span>后端服务</span>
  <span id="statusText">检测中...</span>
</div>

<div class="toggle-row">
  <span class="toggle-label">自动捕获 (每10秒)</span>
  <label class="toggle-switch">
    <input type="checkbox" id="autoToggle">
    <span class="toggle-slider"></span>
  </label>
</div>

<button class="btn btn-primary" id="captureBtn">立即捕获当前对话</button>
<button class="btn btn-secondary" id="openUiBtn">打开搜索界面</button>

<div class="hint" id="lastCapture" style="margin-top:10px;"></div>
<div class="hint">
  <a href="http://localhost:8765" target="_blank">localhost:8765</a>
</div>

<script src="popup.js"></script>
</body>
</html>
